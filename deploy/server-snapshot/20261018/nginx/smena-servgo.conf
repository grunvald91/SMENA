server {
 listen 80;
 server_name smena.servgo.ru;
 location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
 location / { return 301 https://smena.servgo.ru$request_uri; }
}
server {
 listen 443 ssl;
 server_name smena.servgo.ru;
 ssl_certificate /etc/letsencrypt/live/smena.servgo.ru/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/smena.servgo.ru/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 root /var/www/smena-servgo/current;
 index index.html;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy no-referrer always;
 add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
 add_header Cache-Control no-cache always;
 location / { try_files $uri $uri/ =404; }
}
